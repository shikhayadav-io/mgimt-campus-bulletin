<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MGIMT Portal Login | Campus Bulletin</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">

  <div class="login-card">
    
    <!-- Single Clean Centered Header -->
    <div class="login-header" style="text-align: center; margin-bottom: 1.5rem;">
      <div style="display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 1rem;">
        <img 
          src="image.png" 
          alt="MGIMT Logo" 
          style="width: 80px; height: 80px; max-width: 80px; max-height: 80px; object-fit: contain; border-radius: 50%; background: #ffffff; padding: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.12); display: block; margin: 0 auto;" 
        />
      </div>
      <h2 style="font-size: 1.25rem; font-weight: 800; color: #1e293b; line-height: 1.3; margin: 0.5rem 0 0 0;">MG Institute of Management and Technology</h2>
      <p style="font-size: 0.82rem; color: #64748b; margin-top: 0.25rem; font-weight: 500;">Banthra, Lucknow | Affiliated to AKTU</p>
      <div style="display: inline-block; margin-top: 0.6rem; background-color: #e0f2fe; color: #0369a1; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.25rem 0.65rem; border-radius: 999px;">Student &amp; Faculty Portal</div>
    </div>

    <!-- Login Form -->
    <form class="login-form" action="index.html" method="get">
      
      <!-- Full Name -->
      <div class="form-group">
        <label for="full-name">Full Name</label>
        <input 
          type="text" 
          id="full-name" 
          name="fullname" 
          placeholder="e.g. Abraham Lincoln" 
          required 
          autocomplete="name"
        />
      </div>

      <!-- Email ID -->
      <div class="form-group">
        <label for="user-email">Email ID</label>
        <input 
          type="email" 
          id="user-email" 
          name="email" 
          placeholder="e.g. student@mgimt.ac.in" 
          required 
          autocomplete="email"
        />
      </div>

      <!-- Submit Button -->
      <button type="submit" class="login-submit-btn">Continue to Campus Bulletin &rarr;</button>

      <div class="login-footer-back">
        <a href="index.html">&larr; Directly View Public Notices</a>
      </div>
    </form>

  </div>

</body>
</html>
